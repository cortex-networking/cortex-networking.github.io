name: Draft Site Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-site-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site.yml
  safety:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/repository-safety.yml
  release:
    needs: [validate, safety]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site
          path: dist
      - name: Verify and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(cat COMMIT)" = "$GITHUB_SHA"
          gh release create "candidate-$GITHUB_SHA" site.tar.gz COMMIT SHA256SUMS --target "$GITHUB_SHA" --draft --title "Site candidate $GITHUB_SHA" --notes "Verified static bundle. No deployment was performed."
