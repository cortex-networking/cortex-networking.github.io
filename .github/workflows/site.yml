name: Site CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Site Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Bundle the tested static files
        run: |
          mkdir -p dist
          tar -czf dist/site.tar.gz index.html 404.html styles.css fonts.css fonts favicon.svg og.png robots.txt sitemap.xml CNAME
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT
          cd dist
          sha256sum site.tar.gz COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
