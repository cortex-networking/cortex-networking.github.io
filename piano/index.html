<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Middle C – piano lessons for your MIDI keyboard</title>
  <meta name="description" content="Learn piano in the browser with any USB MIDI keyboard: guided lessons, songs that wait for you, play-along scoring and note-reading games.">
  <meta name="theme-color" content="#ECEDE8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#232624" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/notation-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-tab="lessons">
  <header class="bar">
    <a class="brand" href="#/lessons" aria-label="Middle C home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <line x1="3" y1="16" x2="29" y2="16" />
        <ellipse cx="16" cy="16" rx="8.2" ry="5.6" transform="rotate(-20 16 16)" />
      </svg>
      <span>Middle C</span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="lessons" aria-selected="true">Lessons</button>
      <button role="tab" data-tab="songs" aria-selected="false">Songs</button>
      <button role="tab" data-tab="games" aria-selected="false">Games</button>
      <button role="tab" data-tab="free" aria-selected="false">Free play</button>
    </nav>
    <div class="bar-end">
      <button class="device" id="device" type="button" data-state="idle">
        <span class="dot" aria-hidden="true"></span><span class="device-label">Connect keyboard</span>
      </button>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <aside class="list" id="list" aria-label="Contents"></aside>
    <div class="list-scrim" id="list-scrim"></div>
    <section class="board" id="board" aria-live="polite">
      <div class="board-head">
        <button class="list-toggle" id="list-toggle" type="button" aria-controls="list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <span>All</span>
        </button>
        <div class="titles">
          <p class="kicker" id="kicker"></p>
          <h1 id="title"></h1>
        </div>
        <div class="pips" id="pips" role="img"></div>
      </div>
      <p class="prompt" id="prompt"></p>
      <div class="score">
        <svg class="staff" id="staff" role="img" aria-label="Music staff"></svg>
        <div class="big" id="big" aria-live="polite"></div>
      </div>
      <div class="board-foot">
        <div class="foot" id="foot"></div>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="piano" id="piano" aria-label="Piano keyboard"></footer>

  <dialog id="settings" aria-label="Settings"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Middle C needs JavaScript to run.</p></noscript>
</body>
</html>
